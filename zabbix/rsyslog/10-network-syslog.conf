# /etc/rsyslog.d/10-network-syslog.conf
# Receive syslog from switches and firewalls on UDP/TCP 514 and write
# one file per device under /var/log/network/.
# Retention (31 days) is enforced by /etc/logrotate.d/network-syslog.
#
# Prep once:
#   sudo mkdir -p /var/log/network
#   sudo chown syslog:adm /var/log/network
# Open the firewall if ufw is active:
#   sudo ufw allow from <mgmt-subnet> to any port 514

module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")

# One file per source device, named by its IP/hostname
template(name="NetworkDeviceLog" type="string"
         string="/var/log/network/%FROMHOST%.log")

# Anything arriving from the network (i.e., not from this host itself)
# goes to the per-device file and stops - it must not pollute
# /var/log/syslog on the Zabbix server.
if ($fromhost-ip != "127.0.0.1") then {
    action(type="omfile" dynaFile="NetworkDeviceLog")
    stop
}
