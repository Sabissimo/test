# /etc/zabbix/zabbix_server.conf
# Zabbix 8.0 server configuration
# Sized for: ~60 SNMP devices, ~2,500 interfaces, ~28k items, ~200 NVPS
# Host: 4 vCPU / 16 GB RAM, MySQL on the same machine.

############ GENERAL ############

ListenPort=10051
LogFile=/var/log/zabbix/zabbix_server.log
LogFileSize=10
PidFile=/run/zabbix/zabbix_server.pid
SocketDir=/run/zabbix

############ DATABASE ############

DBHost=localhost
DBName=zabbix
DBUser=zabbix
# Set your real password here (same one used in the MySQL GRANT):
DBPassword=CHANGE_ME
DBSocket=/var/run/mysqld/mysqld.sock

############ POLLERS ############

# Generic pollers (internal checks, calculated items, etc.)
StartPollers=10

# Async SNMP pollers (Zabbix 7+/8): each handles up to
# MaxConcurrentChecksPerPoller concurrent SNMP requests.
# 8 pollers is generous headroom for 60 devices / 28k SNMP items.
StartSNMPPollers=8
MaxConcurrentChecksPerPoller=1000

# ICMP availability checks for 60 devices
StartPingers=3
FpingLocation=/usr/bin/fping

# Passive trap listeners (agents, sender, proxies)
StartTrappers=5

# Network discovery (used to auto-register the switches)
StartDiscoverers=2

StartHTTPPollers=1
StartPreprocessors=8

# Pollers for hosts flagged unreachable, so a dead switch doesn't
# stall polling of healthy ones
StartUnreachablePollers=3
UnreachablePeriod=45
UnavailableDelay=60
UnreachableDelay=15

############ SNMP TRAPS ############

# Enable so trunk link-down traps arrive instantly instead of at next poll.
# Requires snmptrapd + zabbix_trap_receiver (see README section 5.3).
SNMPTrapperFile=/var/log/snmptrap/snmptrap.log
StartSNMPTrapper=1

############ CACHES ############
# See README section 4 for rationale. Watch Reports -> System information;
# grow any cache that passes ~80% used.

# Configuration cache: hosts, items, triggers
CacheSize=256M
CacheUpdateFrequency=10

# Write cache for collected values awaiting DB flush
HistoryCacheSize=256M
HistoryIndexCacheSize=64M

# Hourly trend aggregation
TrendCacheSize=128M
TrendFunctionCacheSize=64M

# Recent values kept in RAM for trigger evaluation - biggest performance win
ValueCacheSize=512M

# History write processes to MySQL
StartDBSyncers=4

############ HOUSEKEEPING (1-month retention enforcement) ############

# Run every hour, deleting expired rows in small batches, instead of one
# huge nightly delete that stalls the DB. The retention PERIODS themselves
# are set in the web UI: Administration -> Housekeeping (31d overrides).
HousekeepingFrequency=1
MaxHousekeeperDelete=50000

############ TIMEOUTS / MISC ############

Timeout=10
TrapperTimeout=300
LogSlowQueries=3000

StartEscalators=1
StartAlerters=3

StatsAllowedIP=127.0.0.1
